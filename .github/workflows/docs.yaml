name: docs

on:
  push:
    branches:
      - main
    tags:
      - 'v*'   # build docs for version tags too
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .[docs]

      - name: Determine version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            # Tagged release
            echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV
            echo "IS_RELEASE=true" >> $GITHUB_ENV
          else
            # Main branch commit
            SHORT_SHA=$(git rev-parse --short HEAD)
            echo "VERSION=main-${SHORT_SHA}" >> $GITHUB_ENV
            echo "IS_RELEASE=false" >> $GITHUB_ENV
          fi

      - name: Build HTML docs
        run: sphinx-build docs "docs/_build/html/${VERSION}"

      - name: Copy latest release to `latest` folder`
        run: |
          if [ "$IS_RELEASE" = "true" ]; then
            VERSION_DIR="docs/_build/html/${VERSION}"
            LATEST_DIR="docs/_build/html/latest"
            rm -rf "$LATEST_DIR"
            cp -r "$VERSION_DIR" "$LATEST_DIR"
          fi


      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: "docs/_build/html/${VERSION}"
