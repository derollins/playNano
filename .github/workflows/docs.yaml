name: Build and Deploy Docs

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

# Uncomment if your repo/org has restrictive default permissions for GITHUB_TOKEN
# permissions:
#   contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout (full history incl. tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Set VERSION environment variable
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "VERSION=latest" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "VERSION=dev" >> $GITHUB_ENV
          fi

      # Build single-version on PRs, multiversion on main/tags
      - name: Build docs (PR: single-version; Main/Tag: multiversion)
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "PR build -> single-version sphinx-build"
            sphinx-build -b html docs docs/_build/html
          else
            echo "Main/Tag build -> sphinx-multiversion"
            sphinx-multiversion docs/ docs/_build/html
          fi
      - name: Create "stable" alias (latest v* tag)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SITE_DIR="docs/_build/html"
          cd "$SITE_DIR"
          latest=$(ls -d v*/ 2>/dev/null | sed 's#/##' | sort -Vr | head -n1 || true)
          if [ -n "$latest" ]; then
            echo "Creating stable alias from $latest"
            rm -rf stable
            cp -a "$latest" stable
          else
            echo "No tag directories found; skipping stable alias."
          fi

      - name: Create root index.html redirect to main/
        shell: bash
        run: |
          SITE_DIR="docs/_build/html"
          mkdir -p "$SITE_DIR"
          cat > "$SITE_DIR/index.html" <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Redirecting…</title>
          <meta http-equiv="refresh" content="0; url=./main/">
          <script>window.location.replace("./main/");</script>
          <p>If you are not redirected, ./main/click here</a>.</p>
HTML

      - name: Generate versions.json (project page /playNano base)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          SITE_DIR="docs/_build/html"
          cd "$SITE_DIR"
          BASE="/playNano"   # GitHub Pages repo path (case matches repo name)

          versions=$(ls -d */ | sed 's#/##' | grep -E '^(main|stable|v[0-9]+\.[0-9]+(\.[0-9]+)?)$' || true)

          json="["
          first=true

          if echo "$versions" | grep -qx "main"; then
            entry="{\"name\":\"latest\",\"title\":\"main (latest)\",\"url\":\"${BASE}/main/\"}"
            json="$json$entry"; first=false
          fi
          if echo "$versions" | grep -qx "stable"; then
            entry="{\"name\":\"stable\",\"title\":\"stable (latest release)\",\"url\":\"${BASE}/stable/\"}"
            if [ "$first" = true ]; then json="$json$entry"; first=false; else json="$json,$entry"; fi
          fi
          for v in $(echo "$versions" | grep -E '^v[0-9]+' | sort -Vr); do
            entry="{\"name\":\"$v\",\"title\":\"$v\",\"url\":\"${BASE}/$v/\"}"
