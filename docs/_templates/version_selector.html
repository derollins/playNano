<div id="version-selector-wrapper" style="margin-bottom: 1em;">
  <label for="version-selector">Version:</label>
  <select id="version-selector" onchange="goToVersion(this.value)">
    {% for v in versions %}
      <option value="{{ v }}" {% if v == current_version %}selected{% endif %}>{{ v }}</option>
    {% endfor %}
  </select>
</div>

<script>
function goToVersion(version) {
    const pathParts = window.location.pathname.split('/');
    const currentFile = pathParts[pathParts.length-1] || 'index.html';
    window.location.href = `./${version}/${currentFile}`;
}
</script>
