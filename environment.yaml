name: playnano_env
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - numpy>=1.23
  - pandas
  - h5py
  - pillow
  - tifffile
  - matplotlib
  - scipy
  - scikit-learn
  - scikit-image
  - pyyaml>=6.0
  - opencv-python-headless
  - pip
  - pip:
      - afmreader>=0.0.7,<0.0.9
      - python-dateutil>=2.8
      # Qt from pip, not conda-forge: playNano depends on PySide6-Essentials,
      # which conda-forge's pyside6 does not satisfy (see docs/installation.rst).
      - PySide6-Essentials>=6.5
