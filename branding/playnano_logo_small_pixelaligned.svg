<?xml version="1.0" encoding="UTF-8"?>
<!-- playNano small icon (16 / 32 px), pixel-aligned.
     100-unit page: 1 px at 16 px = 6.25 units, at 32 px = 3.125 units.
     5 bars x 12.5 tall (2 px @16, 4 px @32), gaps 6.25 (1 px @16, 2 px @32).
     Triangle (18.75,6.25) (18.75,93.75) (93.75,50): 1 px margin top/bottom/right,
     3 px left, shifted right for optical centring of the play shape.
     Real holes between bars (transparent background), square corners.
     Gradient #BD7014 -> #E59819 reads on both light and dark tabs. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="18.75" y1="0" x2="93.75" y2="0">
      <stop offset="0" stop-color="#BD7014"/>
      <stop offset="1" stop-color="#E59819"/>
    </linearGradient>
  </defs>
  <path fill="url(#gold)" d="
    M18.75 6.25  L40.1786 18.75 L18.75 18.75 Z
    M18.75 25    L50.8929 25    L72.3214 37.5  L18.75 37.5 Z
    M18.75 43.75 L83.0357 43.75 L93.75 50      L83.0357 56.25 L18.75 56.25 Z
    M18.75 62.5  L72.3214 62.5  L50.8929 75    L18.75 75 Z
    M18.75 81.25 L40.1786 81.25 L18.75 93.75 Z"/>
</svg>
